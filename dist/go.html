        "shenxing": { u: "aHR0cHM6Ly9wcHMxMjMuc2hlbnhpbmdhZmYuY29tLyMvP2NvZGU9NnRRN3pIVWM=", n: "神行加速", p: "sx0077" },

        "jilianyun": { u: "aHR0cHM6Ly9oYW96ZXZwbi5qbHl2aXBhZmYuY29tLyMvP2NvZGU9andDTU92UU8=", n: "极连云", p: "JLY888" },
        "edgenode": { u: "aHR0cHM6Ly93ZXAuZWRnZW5vdmFhZmYuY29tLyMvP2NvZGU9bUxMTDZoNkY=", n: "边缘节点", p: "xk808" },
        "bianyuan": { u: "aHR0cHM6Ly93ZXAuZWRnZW5vdmFhZmYuY29tLyMvP2NvZGU9bUxMTDZoNkY=", n: "边缘节点", p: "xk808" },

        "telegram": { u: "aHR0cHM6Ly90Lm1lL2h1YW5xaXV0aTg4OTk=", n: "官方 Telegram 客服", p: "" },
        "tg": { u: "aHR0cHM6Ly90Lm1lL2h1YW5xaXV0aTg4OTk=", n: "官方 Telegram 客服", p: "" }
      };

      function getParam(name) {
        var params = new URLSearchParams(window.location.search);
        var val = params.get(name);
        if (!val && window.location.hash) {
          var hash = window.location.hash.replace(/^#\/?/, '');
          if (hash.indexOf('=') !== -1) {
            var hp = new URLSearchParams(hash);
            val = hp.get(name);
          } else if (name === 'id' || name === 'target') {
            val = hash;
          }
        }
        return val;
      }

      var targetKey = (getParam('id') || getParam('target') || getParam('aff') || getParam('channel') || '').toLowerCase();
      var partner = MAP[targetKey];

      function decodeTarget(b64) {
        try {
          return decodeURIComponent(escape(atob(b64)));
        } catch (e) {
          try {
            return atob(b64);
          } catch (err) {
            return '';
          }
        }
      }

      window.__AFF_INIT__ = function() {
        var titleEl = document.getElementById('redirect-title');
        var descEl = document.getElementById('redirect-desc');
        var manualLink = document.getElementById('manual-link');
        var promoBox = document.getElementById('promo-box');
        var promoCode = document.getElementById('promo-code');
        var statusEl = document.getElementById('status-indicator');

        if (partner && partner.u) {
          var targetUrl = decodeTarget(partner.u);
          if (targetUrl) {
            document.title = '正在安全跳转至 ' + partner.n + ' 官网... - 机场图鉴';
            titleEl.textContent = '正在安全建立直达通道...';
            descEl.innerHTML = '已为您匹配【<strong>' + partner.n + '</strong>】官方安全合规通道，即将自动直达。';
            if (partner.p) {
              promoCode.textContent = partner.p;
              promoBox.style.display = 'inline-flex';
            }
            manualLink.href = targetUrl;
            manualLink.style.display = 'inline-flex';

            // 触发 301 语义的客户端无缝重定向
            setTimeout(function() {
              window.location.replace(targetUrl);
            }, 180);
            return;
          }
        }

        // 未匹配到有效服务商
        document.title = '通道无效或未指定 - 机场图鉴';
        titleEl.textContent = '直达通道未指定或已失效';
        descEl.textContent = '未找到匹配的直连服务商标识，请从排行榜或评测推荐页重新进入。';
        statusEl.innerHTML = '<span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-2"></span>请检查访问路径或返回主站导航';
        var backBtn = document.getElementById('back-link');
        if (backBtn) backBtn.style.display = 'inline-flex';
      };
    })();
  </script>

    <!-- H1 Heading Required -->
